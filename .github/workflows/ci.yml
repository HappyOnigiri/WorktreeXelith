name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: static
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install pinned Go tools
        run: make setup-go-tools
      - name: Install markdown checker
        run: make setup-markdownlint
      - name: Install pinned ShellCheck
        run: |
          image="koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d"
          docker pull "$image"
          container_id="$(docker create "$image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/bin/shellcheck" /tmp/shellcheck
          docker rm "$container_id"
          trap - EXIT
          sudo install -m 0755 /tmp/shellcheck /usr/local/bin/shellcheck
      # 個別targetを並べるとci-checks側との差が生まれ、tests-checkのように適用漏れが起きる。
      - run: make static-check
      - name: Verify read-only check
        run: git diff --exit-code

  coverage-tests:
    name: coverage-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: coverage
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build CI test runner
        run: mkdir -p .tools/bin && go build -trimpath -o .tools/bin/citest ./tools/citest
      - run: make coverage-check CITEST=.tools/bin/citest
      - name: Upload CI test report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ci-tests-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests/coverage
          if-no-files-found: error
          retention-days: 30
      - run: git diff --exit-code

  # 少コアのCIランナーではrace検査がCPU律速になるため、実測重みでdaemon・restを分ける。
  race:
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [daemon-0, daemon-1, daemon-2, rest-0, rest-1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: race-${{ matrix.shard }}
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build CI test runners
        run: |
          mkdir -p .tools/bin
          go build -trimpath -o .tools/bin/citest ./tools/citest
          go build -trimpath -o .tools/bin/testshard ./tools/testshard
      - env:
          RACE_SHARD: ${{ matrix.shard }}
        run: make "test-race-$RACE_SHARD" CITEST=.tools/bin/citest TESTSHARD=.tools/bin/testshard
      - name: Upload CI test report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ci-tests-race-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests/race-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30
      - run: git diff --exit-code

  # coverageは既存の必須チェック名を保つ集約ジョブである。
  # needs.race.resultはmatrixの全shardをまとめた結果になる。
  # どちらかがsuccess以外なら失敗させ、スキップやキャンセルを成功と見なさない。
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [coverage-tests, race]
    if: always()
    steps:
      - name: Require both test jobs to succeed
        env:
          COVERAGE_TESTS_RESULT: ${{ needs.coverage-tests.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          echo "coverage-tests=$COVERAGE_TESTS_RESULT race=$RACE_RESULT"
          test "$COVERAGE_TESTS_RESULT" = success
          test "$RACE_RESULT" = success

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: build
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # 一時prefixへのinstall検証はmake smokeが --help/--version の確認込みで行うため、ここでは重複させない。
      - run: make build version-check smoke build-darwin release-check
      - run: go version -m bin/wx
      - run: git diff --exit-code
